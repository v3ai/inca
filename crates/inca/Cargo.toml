[package]
name = "inca"
description = "Inca - a free 3D modeling, animation and rendering application"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
inca-core = { path = "../inca-core" }
glam.workspace = true
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "persistence"] }
egui = "0.36"
egui_plot = "0.37"
transform-gizmo-egui = "0.11"
rfd = "0.15"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = "0.48"
rhai = { version = "1", features = ["sync"] }
