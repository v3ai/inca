# Build and publish a GitHub Release. Runs when a tag like v0.1.1 is pushed (`npm run release`),
# or when package.json's version changes on master: then the workflow creates the vX.Y.Z tag itself
# (cloud sessions can push commits but not tags). Nothing happens if that version is already released.
name: release

on:
  push:
    tags: ['v*']
    branches: [master]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # tag (if needed) and a draft release with the generated notes, made once before the builds upload to it
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="${GITHUB_REF#refs/tags/}"; else tag="v$(node -p "require('./package.json').version")"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag is already released"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then echo "$tag was pushed as a tag; that run builds it"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            git tag "$tag" "$GITHUB_SHA" && git push origin "$tag"
          fi
          gh release create "$tag" --draft --verify-tag --generate-notes --title "$tag"
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage
            files: dist/*.AppImage
          - os: windows-latest
            args: --win zip portable
            files: dist/*.zip dist/*-portable.exe
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        shell: bash
        run: >
          npx electron-builder ${{ matrix.args }} --x64 --publish never
          '-c.portable.artifactName=${productName}-${version}-win-x64-portable.${ext}'
      - name: Upload
        shell: bash
        run: gh release upload "${{ needs.prepare.outputs.tag }}" ${{ matrix.files }} --clobber

  # publish only once every download is attached
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release edit "${{ needs.prepare.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
