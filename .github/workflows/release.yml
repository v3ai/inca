# Build and publish a GitHub Release. Runs when a tag like v0.2.1 is pushed, or when the workspace
# version in Cargo.toml changes on master: then the workflow creates the vX.Y.Z tag itself (cloud
# sessions can push commits but not tags). Nothing happens if that version is already released.
name: release

on:
  push:
    tags: ['v*']
    branches: [master]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # tag (if needed) and a draft release with the generated notes, made once before the builds upload to it
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      build: ${{ steps.v.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="${GITHUB_REF#refs/tags/}"; else tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            # a draft left by a failed run is rebuilt; a published release is left alone
            if [[ "$(gh release view "$tag" --json isDraft -q .isDraft)" == "true" ]]; then echo "build=true" >> "$GITHUB_OUTPUT"; else echo "$tag is already released"; echo "build=false" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then echo "$tag was pushed as a tag; that run builds it"; echo "build=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            git tag "$tag" "$GITHUB_SHA" && git push origin "$tag"
          fi
          gh release create "$tag" --draft --verify-tag --generate-notes --title "$tag"
          echo "build=true" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            package: linux
            target: x86_64-unknown-linux-gnu
            files: dist/*.AppImage dist/*.tar.gz
          - os: windows-latest
            package: windows
            target: x86_64-pc-windows-msvc
            files: dist/*.zip dist/*-portable.exe
          # unsigned apart from an ad-hoc signature; there is no Apple Developer account
          - os: macos-latest
            package: mac
            target: aarch64-apple-darwin
            files: dist/*.dmg
          - os: macos-latest
            package: mac
            target: x86_64-apple-darwin
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.package }}" == mac ]]; then cargo build --release -p inca --target ${{ matrix.target }}; else cargo build --release -p inca; fi
      - name: Package
        shell: bash
        run: packaging/package.sh ${{ matrix.package }} ${{ matrix.target }}
      - name: Upload
        shell: bash
        run: gh release upload "${{ needs.prepare.outputs.tag }}" ${{ matrix.files }} --clobber

  # publish only once every download is attached
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh release edit "${{ needs.prepare.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
